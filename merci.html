<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Commande confirmée — The 3D Printer</title>
  <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6a3aa98df65cee997e2fec25/d05e54715_5dc10467-5b9a-48e5-beea-3bd4166c3e64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: #f5f3ef;
      --surface: #ffffff;
      --text: #161616;
      --text-light: #666666;
      --accent: #ff6b35;
      --accent-dark: #de4f1d;
      --success: #2fa84f;
      --border: #d9d6d0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 15%, rgba(47, 168, 79, 0.14), transparent 34%),
        var(--background);
      color: var(--text);
      font-family: "Inter", Arial, sans-serif;
    }

    .confirmation-card {
      width: min(100%, 680px);
      padding: clamp(34px, 7vw, 68px);
      border: 1px solid var(--border);
      border-radius: 36px;
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.11);
      text-align: center;
      animation: card-in 0.65s ease both;
    }

    .logo {
      width: 62px;
      height: 62px;
      margin: 0 auto 28px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: #fff;
      object-fit: contain;
    }

    .check-circle {
      width: 112px;
      height: 112px;
      margin: 0 auto 30px;
    }

    .check-circle circle {
      fill: none;
      stroke: var(--success);
      stroke-width: 5;
      stroke-dasharray: 302;
      stroke-dashoffset: 302;
      animation: draw-circle 0.75s 0.2s ease forwards;
    }

    .check-circle path {
      fill: none;
      stroke: var(--success);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 78;
      stroke-dashoffset: 78;
      animation: draw-check 0.55s 0.85s ease forwards;
    }

    .eyebrow {
      margin-bottom: 14px;
      color: var(--success);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 20px;
      font-size: clamp(38px, 7vw, 64px);
      font-weight: 900;
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .message {
      max-width: 510px;
      margin: 0 auto;
      color: var(--text-light);
      font-size: 16px;
      line-height: 1.75;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 34px;
    }

    .button {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      padding: 0 23px;
      border: 1px solid transparent;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .button:hover { transform: translateY(-2px); }
    .button-primary { background: var(--accent); color: #fff; }
    .button-primary:hover { background: var(--accent-dark); }
    .button-secondary { border-color: var(--border); color: var(--text); }

    @keyframes draw-circle { to { stroke-dashoffset: 0; } }
    @keyframes draw-check { to { stroke-dashoffset: 0; } }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(22px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 520px) {
      .confirmation-card { border-radius: 26px; }
      .actions { display: grid; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="confirmation-card" aria-live="polite">
    <img class="logo" src="https://media.base44.com/images/public/6a3aa98df65cee997e2fec25/d05e54715_5dc10467-5b9a-48e5-beea-3bd4166c3e64.png" alt="Logo The 3D Printer">

    <svg class="check-circle" viewBox="0 0 110 110" aria-hidden="true">
      <circle cx="55" cy="55" r="48"></circle>
      <path d="M31 56 L48 73 L80 39"></path>
    </svg>

    <p class="eyebrow">Commande confirmée</p>
    <h1>Merci pour votre commande !</h1>
    <p class="message">
      Votre paiement a bien été pris en compte. Nous allons préparer votre commande
      et vous recevrez les informations utiles par e-mail.
    </p>

    <div class="actions">
      <a class="button button-primary" href="/index.html#catalogue">Retour au catalogue</a>
      <a class="button button-secondary" href="/index.html#contact">Nous contacter</a>
    </div>
  </main>

  <script>
    localStorage.removeItem("the3dprinter_cart_v1");

    const url = new URL(window.location.href);
    if (url.searchParams.has("session_id")) {
      url.searchParams.delete("session_id");
      history.replaceState({}, "", url.pathname);
    }
  </script>
</body>
</html>
